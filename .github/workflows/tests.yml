name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unittest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile every module (fast syntax gate)
        run: python -m compileall -q src tests

      - name: Verify configuration and directory contract
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, ".")
          from src import config
          for name in ("RAW_DIR", "PROC_DIR", "MODEL_DIR", "DOCS_DIR", "ACADEMIC_DIR"):
              path = getattr(config, name)
              print(f"{name:<12} {path}")
          print("config OK")
          PY

      - name: Run unit test suite
        run: python -m unittest discover -s tests -v

      - name: Verify pretrained artifacts are present
        run: |
          python - <<'PY'
          import glob, os
          models = sorted(glob.glob("models/*.joblib") + glob.glob("models/*.keras"))
          print(f"trained artifacts: {len(models)}")
          total = sum(os.path.getsize(m) for m in models)
          print(f"total size: {total/1e6:.1f} MB")
          assert models, "no trained artifacts found in models/"
          PY
